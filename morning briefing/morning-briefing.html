<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Morning Briefing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a0e27;
            --secondary: #1a1f3a;
            --accent: #00d9ff;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
            --text-primary: #f0f2f5;
            --text-secondary: #a0a8b8;
            --border: #2a3a5a;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #0f1432 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #00bbff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .control-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            border-color: var(--accent);
            background: rgba(0, 217, 255, 0.05);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent) 0%, #00bbff 100%);
            border-color: var(--accent);
            color: var(--primary);
            font-weight: 600;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        .api-key-section {
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .api-key-section.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .api-key-section input {
            width: 100%;
            padding: 10px 12px;
            background: var(--secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        .api-key-section input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.1);
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--danger);
            color: #ff6688;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideDown 0.3s ease-out;
        }

        .error strong {
            display: block;
            margin-bottom: 8px;
        }

        section {
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        section h2 {
            font-size: 1.3em;
            font-weight: 400;
            margin-bottom: 20px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(26, 31, 58, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            border-color: var(--border);
            background: rgba(26, 31, 58, 0.8);
            transform: translateY(-4px);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 1.8em;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-change {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95em;
            font-weight: 500;
        }

        .change-up {
            color: var(--success);
        }

        .change-down {
            color: var(--danger);
        }

        .change-neutral {
            color: var(--text-secondary);
        }

        .arrow {
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            margin-top: 2px;
        }

        .arrow-up {
            border-bottom: 6px solid currentColor;
        }

        .arrow-down {
            border-top: 6px solid currentColor;
        }

        .summary {
            background: rgba(0, 217, 255, 0.05);
            border-left: 3px solid var(--accent);
            padding: 16px;
            border-radius: 6px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin: 20px 0;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-item {
            background: rgba(26, 31, 58, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            border-color: var(--accent);
            background: rgba(26, 31, 58, 0.8);
        }

        .news-headline {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .news-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .impact-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .impact-high {
            background: rgba(255, 51, 102, 0.2);
            color: var(--danger);
        }

        .impact-medium {
            background: rgba(255, 170, 0, 0.2);
            color: var(--warning);
        }

        .impact-low {
            background: rgba(160, 168, 184, 0.1);
            color: var(--text-secondary);
        }

        .takeaway {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1) 0%, rgba(0, 255, 136, 0.05) 100%);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        .takeaway h3 {
            color: var(--accent);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .takeaway p {
            font-size: 1.05em;
            line-height: 1.7;
            color: var(--text-primary);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.85em;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-stocks {
            color: var(--text-secondary);
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .control-bar {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 Morning Briefing</h1>
            <p class="subtitle">
                <span class="status-indicator"></span>
                Live Market Data powered by Claude
            </p>
        </header>

        <div class="control-bar">
            <button id="fetchBtn" class="primary">Abrufen</button>
            <button id="apiKeyBtn">API-Key verwalten</button>
            <button id="settingsBtn">Aktien anpassen</button>
        </div>

        <div id="apiKeySection" class="api-key-section">
            <p style="margin-bottom: 12px; font-size: 0.9em; color: var(--text-secondary);">
                Gib deinen Claude API-Key ein (wird lokal gespeichert):
            </p>
            <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
            <button onclick="saveApiKey()">API-Key speichern</button>
        </div>

        <div id="settingsSection" class="api-key-section">
            <p style="margin-bottom: 12px; font-size: 0.9em; color: var(--text-secondary);">
                Bearbeite deine Aktien (kommagetrennt):
            </p>
            <input type="text" id="stocksInput" placeholder="ZS,GOOG,CCJ,FSLR,SEDG,OKLO,HOOD">
            <button onclick="saveStocks()">Speichern</button>
        </div>

        <div id="content"></div>

        <footer>
            Daten werden live über die Claude API mit Web Search abgerufen
        </footer>
    </div>

    <script>
        const DEFAULT_STOCKS = ['ZS', 'GOOG', 'CCJ', 'FSLR', 'SEDG', 'OKLO', 'HOOD'];

        document.getElementById('fetchBtn').addEventListener('click', fetchBriefing);
        document.getElementById('apiKeyBtn').addEventListener('click', toggleApiKey);
        document.getElementById('settingsBtn').addEventListener('click', toggleSettings);

        // Load stocks from localStorage
        function getStocks() {
            const stored = localStorage.getItem('stocks');
            return stored ? stored.split(',').map(s => s.trim()) : DEFAULT_STOCKS;
        }

        function saveStocks() {
            const value = document.getElementById('stocksInput').value;
            localStorage.setItem('stocks', value);
            document.getElementById('settingsSection').classList.remove('active');
            alert('Aktien gespeichert!');
        }

        function toggleSettings() {
            const section = document.getElementById('settingsSection');
            section.classList.toggle('active');
            if (section.classList.contains('active')) {
                document.getElementById('stocksInput').value = getStocks().join(', ');
            }
        }

        function toggleApiKey() {
            document.getElementById('apiKeySection').classList.toggle('active');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            if (!key) {
                alert('Bitte gib einen API-Key ein');
                return;
            }
            localStorage.setItem('apiKey', key);
            document.getElementById('apiKeySection').classList.remove('active');
            document.getElementById('apiKeyInput').value = '';
            alert('API-Key gespeichert!');
        }

        function getApiKey() {
            return localStorage.getItem('apiKey');
        }

        async function fetchBriefing() {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert('Bitte speichere zuerst deinen Claude API-Key');
                document.getElementById('apiKeySection').classList.add('active');
                return;
            }

            const stocks = getStocks();
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Abrufen aktueller Börsendaten...</p>
                </div>
            `;

            try {
                const briefingPrompt = `Du bist ein Finanzanalyst. Stelle ein umfassendes Morning Briefing basierend auf aktuellen Börsendaten zusammen.

Suche und analysiere:
1. Die Performance von NYSE und NASDAQ vom gestrigen Handelstag (Indizes, Veränderungen)
2. Aktuelle Kurse und 24h-Änderungen für: ${stocks.join(', ')}
3. Wichtige Markttrends und Nachrichten

Antworte NUR mit einem gültigen JSON-Objekt (kein Markdown, keine Erklärungen):
{
  "marketSummary": {
    "date": "YYYY-MM-DD",
    "nyse": {"name": "NYSE", "value": number, "change": number, "changePercent": number},
    "nasdaq": {"name": "NASDAQ", "value": number, "change": number, "changePercent": number},
    "summary": "2-3 Sätze Übersicht"
  },
  "stocks": {
    "SYMBOL": {
      "price": number,
      "change": number,
      "changePercent": number,
      "news": "kurze Kontextinfo"
    }
  },
  "marketNews": [
    {"headline": "string", "impact": "high|medium|low", "category": "string"}
  ],
  "briefingSummary": "Key-Erkenntnis des Tages"
}`;

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-1',
                        max_tokens: 2000,
                        messages: [
                            { role: 'user', content: briefingPrompt }
                        ],
                        tools: [
                            {
                                type: 'web_search_20250305',
                                name: 'web_search'
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API-Fehler: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                const textContent = result.content
                    .filter(block => block.type === 'text')
                    .map(block => block.text)
                    .join('\n');

                const jsonMatch = textContent.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error('Keine gültigen Daten zurückgegeben');

                const data = JSON.parse(jsonMatch[0]);
                renderBriefing(data);
            } catch (error) {
                content.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Fehler</strong>
                        ${error.message}
                    </div>
                `;
                console.error(error);
            }
        }

        function renderBriefing(data) {
            const content = document.getElementById('content');
            const ms = data.marketSummary;
            
            let html = '<section><h2>Börsenindizes</h2><div class="grid">';

            // NYSE Card
            if (ms.nyse) {
                const nyseChange = ms.nyse.changePercent >= 0;
                html += `
                    <div class="card">
                        <div class="card-label">NYSE</div>
                        <div class="card-value">${ms.nyse.value?.toFixed(2) || '-'}</div>
                        <div class="card-change ${nyseChange ? 'change-up' : 'change-down'}">
                            <span class="arrow ${nyseChange ? 'arrow-up' : 'arrow-down'}"></span>
                            ${ms.nyse.change?.toFixed(2) || 0} (${ms.nyse.changePercent?.toFixed(2) || 0}%)
                        </div>
                    </div>
                `;
            }

            // NASDAQ Card
            if (ms.nasdaq) {
                const nasdaqChange = ms.nasdaq.changePercent >= 0;
                html += `
                    <div class="card">
                        <div class="card-label">NASDAQ</div>
                        <div class="card-value">${ms.nasdaq.value?.toFixed(2) || '-'}</div>
                        <div class="card-change ${nasdaqChange ? 'change-up' : 'change-down'}">
                            <span class="arrow ${nasdaqChange ? 'arrow-up' : 'arrow-down'}"></span>
                            ${ms.nasdaq.change?.toFixed(2) || 0} (${ms.nasdaq.changePercent?.toFixed(2) || 0}%)
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            if (ms.summary) {
                html += `<div class="summary">${ms.summary}</div>`;
            }

            html += '</section>';

            // Stocks Section
            html += '<section><h2>Deine Aktien</h2><div class="grid">';

            if (data.stocks && Object.keys(data.stocks).length > 0) {
                for (const [symbol, stock] of Object.entries(data.stocks)) {
                    const isUp = (stock.changePercent || 0) >= 0;
                    html += `
                        <div class="card">
                            <div class="card-label">${symbol}</div>
                            <div class="card-value">$${stock.price?.toFixed(2) || '-'}</div>
                            <div class="card-change ${isUp ? 'change-up' : 'change-down'}">
                                <span class="arrow ${isUp ? 'arrow-up' : 'arrow-down'}"></span>
                                ${stock.change?.toFixed(2) || 0} (${stock.changePercent?.toFixed(2) || 0}%)
                            </div>
                            ${stock.news ? `<div style="font-size: 0.8em; color: var(--text-secondary); margin-top: 8px;">${stock.news}</div>` : ''}
                        </div>
                    `;
                }
            } else {
                html += '<div class="no-stocks">Keine Aktiendaten verfügbar</div>';
            }

            html += '</div></section>';

            // News Section
            if (data.marketNews && data.marketNews.length > 0) {
                html += '<section><h2>Markt-Nachrichten</h2><div class="news-list">';
                data.marketNews.forEach(news => {
                    const impactClass = `impact-${news.impact || 'low'}`;
                    html += `
                        <div class="news-item">
                            <div class="news-headline">${news.headline}</div>
                            <div class="news-meta">
                                <span class="impact-badge ${impactClass}">${news.impact || 'Info'}</span>
                                <span>${news.category || 'Markt'}</span>
                            </div>
                        </div>
                    `;
                });
                html += '</div></section>';
            }

            // Takeaway
            if (data.briefingSummary) {
                html += `
                    <div class="takeaway">
                        <h3>📊 Key Takeaway</h3>
                        <p>${data.briefingSummary}</p>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        // Check if API key exists on load
        window.addEventListener('load', () => {
            if (!getApiKey()) {
                document.getElementById('apiKeySection').classList.add('active');
            }
        });
    </script>
</body>
</html>
